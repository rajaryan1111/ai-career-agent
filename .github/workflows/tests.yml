name: Python tests

on:
  # Pull requests already cover every branch with an open PR, so building branch
  # pushes as well would run the same matrix twice on the same commit. Main keeps
  # its post-merge run, and branches without a PR are checked when the PR opens.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same branch/PR; never share a group across events.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Run tracker integrity smoke test
        run: python scripts/tracker_smoke_test.py
      - name: Compile all Python modules
        run: python -m compileall -q career_agent scripts tests
      - name: Audit research CSV integrity
        run: python scripts/audit_job_source_csv.py
