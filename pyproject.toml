[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-career-agent"
version = "0.1.0"
description = "Local-first desktop assistant for job eligibility review, application tracking, and restorable backups"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
career-agent = "career_agent.cli:main"

[tool.setuptools]
packages = ["career_agent"]

# Quality gates configuration

# ruff: linting and formatting (v0.17.1 compatible)
[tool.ruff]
select = ["E", "F", "W", "I", "UP", "B", "A", "RUF"]
exclude = ["__pycache__", ".git", ".eggs", "*.egg", "build", "dist"]
line-length = 120

# mypy: type checking
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
show_error_codes = true

# Only check core modules that can reasonably be typed
[mypy.career_agent]
strict = true

[mypy.tests]
strict = false

[mypy.career_agent.cli]
strict = false

[mypy.setup]
ignore_missing_imports = true
